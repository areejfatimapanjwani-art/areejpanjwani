<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialSpace Login Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-banner">CLASSROOM DEMO — Do not enter real account details</div>
  <main class="layout">
    <section class="intro">
      <h1>SocialSpace</h1>
      <p>Connect with friends and the world around you.</p>
    </section>
    <section class="login-card">
      <h2>Log in</h2>
      <form id="demoForm">
        <label for="email">Email or phone number</label>
        <input id="email" type="text" placeholder="Enter a demo email" autocomplete="off">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Demo password" autocomplete="off">
        <button type="submit">Log In</button>
      </form>
      <p class="notice" id="notice" aria-live="polite">This sample form does not send or save information.</p>
      <a href="#" id="forgot">Forgotten password?</a>
      <hr>
      <button class="create" id="create">Create new account</button>
    </section>
  </main>
  <footer>Educational front-end practice project • Not an official service</footer>
  <script src="script.js"></script>
</body>
</html>
